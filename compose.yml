# Four services behind one origin:
#   frontend  Caddy: serves both SPAs, proxies /api to backend and /media to rustfs, handles HTTPS
#   backend   FastAPI (runs migrations on start)
#   db        PostgreSQL
#   rustfs    S3-compatible object storage for uploaded images (private network only)
# Production adds published ports and the domain via compose.prod.yml.
#
# Local dev:  docker compose up -d        (compose.override.yml is applied automatically)
# Production: docker compose -f compose.yml -f compose.prod.yml up -d --build

name: creatorhandle

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:18
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  # Uploaded images (avatars, covers, project thumbnails). Not published to the
  # host: the backend writes to it, and Caddy serves public reads at /media/*.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: always
    logging: *logging
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY?Variable not set}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY?Variable not set}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    logging: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rustfs:
        condition: service_healthy
    # Everything else (SMTP, CORS, Sentry, ...) comes from .env; only the
    # required values are re-declared here so a missing one fails fast.
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY?Variable not set}
      - S3_SECRET_KEY=${S3_SECRET_KEY?Variable not set}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # Caddy is the only way in (no published port in production), so trust
      # its X-Forwarded-For: rate limits then see the real client IP
      - FORWARDED_ALLOW_IPS=*
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/ready/')"
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations run before the server starts
      start_period: 60s

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    logging: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty: the API is on the same origin, under /api
        - VITE_API_URL=
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - NODE_ENV=production
    depends_on:
      - backend
      - rustfs
    volumes:
      # Caddy's certificates and state
      - caddy-data:/data
      - caddy-config:/config

# Explicit names keep the volumes created when these files lived in deploy/
# (Compose project "deploy"), so existing data survives the move.
volumes:
  app-db-data:
    name: deploy_app-db-data
  rustfs-data:
    name: deploy_rustfs-data
  caddy-data:
    name: deploy_caddy-data
  caddy-config:
    name: deploy_caddy-config
