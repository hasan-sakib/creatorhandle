<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorHandle — Run your creator business, share it with one link</title>
    <meta
      name="description"
      content="Manage brand deals, projects and tasks in one workspace, then publish a clean public page at /@yourhandle. Built for creators and small creator teams."
    />
    <meta name="theme-color" content="#009688" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CreatorHandle" />
    <meta property="og:title" content="CreatorHandle — Run your creator business, share it with one link" />
    <meta
      property="og:description"
      content="Brands, projects and tasks in one workspace, plus a public page at /@yourhandle."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CreatorHandle — Run your creator business, share it with one link" />
    <meta
      name="twitter:description"
      content="Brands, projects and tasks in one workspace, plus a public page at /@yourhandle."
    />

    <!-- Apply the saved theme before first paint (same key as the dashboard) -->
    <script>
      try {
        var dark;
        var path = location.pathname;
        if (path.indexOf("/@") === 0) {
          // A creator's page: the visitor's own choice, else the creator's
          // default (cached from the last visit), else the device.
          var m = localStorage.getItem("ch-profile-mode");
          if (m !== "light" && m !== "dark") {
            var look = localStorage.getItem("ch-profile-look:" + decodeURIComponent(path.slice(2).split("/")[0]));
            m = look ? JSON.parse(look).mode : null;
          }
          if (m === "light" || m === "dark") dark = m === "dark";
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } else {
          var t = localStorage.getItem("vite-ui-theme");
          dark =
            t === "dark" ||
            ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
