services:

  db:
    restart: "no"
    ports:
      - "5432:5432"

  rustfs:
    restart: "no"
    ports:
      # Web console for browsing uploaded files (login = S3_ACCESS_KEY / S3_SECRET_KEY)
      - "9001:9001"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        # pytest, ruff, mypy, ... for local development and test runs
        INSTALL_DEV: "true"
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ../backend
          action: sync
          target: /app/backend
          ignore:
            - ../backend/.venv
            - .venv
        - path: ../backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ../backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    # Replace (not append to) the base ports; dev serves plain HTTP on :5173
    ports: !override
      - "5173:80"
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}

  # Only built/run on demand: docker compose run --rm playwright
  playwright:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ../frontend/blob-report:/app/frontend/blob-report
      - ../frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
