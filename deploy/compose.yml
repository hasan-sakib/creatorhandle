# Three services behind one origin:
#   frontend  Caddy: serves both SPAs, proxies /api to backend, handles HTTPS
#   backend   FastAPI (runs migrations on start)
#   db        PostgreSQL
# Production adds published ports and the domain via compose.prod.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:18
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    logging: *logging
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    # Everything else (SMTP, CORS, Sentry, ...) comes from .env; only the
    # required values are re-declared here so a missing one fails fast.
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/')"
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations run before the server starts
      start_period: 60s

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    logging: *logging
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Empty: the API is on the same origin, under /api
        - VITE_API_URL=
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - NODE_ENV=production
    depends_on:
      - backend
    volumes:
      # Caddy's certificates and state
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-db-data:
  caddy-data:
  caddy-config:
